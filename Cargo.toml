[package]
name = "linux-monitor"
version = "0.1.0"
edition = "2024"
description = "A lightweight Linux desktop performance monitor overlay"
license = "MIT"
publish = false

[dependencies]
fontdue = "0.9"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
softbuffer = "0.4"
toml = "0.8"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
