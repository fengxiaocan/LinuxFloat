<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="50%" stop-color="#7cdf9b"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cdf9b"/>
      <stop offset="100%" stop-color="#48bb78"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="100%" stop-color="#4299e1"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="#384353" stroke-width="6"/>

  <!-- Top bar / HUD header indicators -->
  <circle cx="96" cy="96" r="10" fill="#e53e3e"/>
  <circle cx="132" cy="96" r="10" fill="#dd6b20"/>
  <circle cx="168" cy="96" r="10" fill="#38a169"/>
  <rect x="340" y="88" width="76" height="16" rx="8" fill="#2d3748"/>

  <!-- Grid lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#2d3748" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="#2d3748" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="#2d3748" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Waveform / Performance graph -->
  <path d="M 80,260 Q 120,260 140,220 T 190,270 T 240,160 T 300,230 T 360,190 L 432,210" 
        fill="none" stroke="url(#lineGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Metric Gauges / Status Bars -->
  <!-- Bar 1: CPU -->
  <rect x="80" y="348" width="352" height="16" rx="8" fill="#263140"/>
  <rect x="80" y="348" width="246" height="16" rx="8" fill="url(#barGrad1)"/>

  <!-- Bar 2: MEM -->
  <rect x="80" y="384" width="352" height="16" rx="8" fill="#263140"/>
  <rect x="80" y="384" width="180" height="16" rx="8" fill="url(#barGrad2)"/>

  <!-- Bar 3: NET/TEMP -->
  <rect x="80" y="420" width="352" height="16" rx="8" fill="#263140"/>
  <rect x="80" y="420" width="120" height="16" rx="8" fill="url(#barGrad3)"/>
</svg>
